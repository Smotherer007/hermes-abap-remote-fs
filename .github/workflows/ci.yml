name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

env:
  # hermes-agent gates every runtime dependency behind
  # `python_version >= '3.14'` (see the comment in its pyproject.toml:
  # "we *only* support 3.14"). On an older interpreter `uv pip install -e .`
  # installs the package with zero dependencies and the `hermes` CLI dies at
  # import time on `ruamel.yaml`, which looks like a plugin failure but is not.
  # The plugin itself stays 3.11-compatible - only the host needs 3.14.
  HERMES_PYTHON: "3.14"

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: python -m pip install "pytest>=8,<10" "pyyaml>=6,<7"

      - name: Run tests
        run: python -m pytest tests

  hermes:
    name: Load in Hermes (plugins doctor + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: plugin

      - uses: actions/checkout@v6
        with:
          repository: NousResearch/hermes-agent
          path: hermes-agent

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.HERMES_PYTHON }}

      - uses: astral-sh/setup-uv@v10

      - name: Install Hermes
        working-directory: hermes-agent
        run: |
          set -euo pipefail
          uv venv -p "$HERMES_PYTHON" .venv
          uv pip install -p .venv/bin/python -e .
          # Smoke test: a host without its runtime dependencies must fail here,
          # not three steps later with a ModuleNotFoundError that reads like a
          # problem with this plugin.
          .venv/bin/hermes --version

      - name: Doctor and validate
        env:
          HERMES_HOME: ${{ runner.temp }}/hermes-home
        run: |
          set -euo pipefail
          mkdir -p "$HERMES_HOME"
          hermes-agent/.venv/bin/hermes plugins doctor plugin --ci
          hermes-agent/.venv/bin/hermes plugins validate plugin
